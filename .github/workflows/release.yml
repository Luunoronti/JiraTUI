name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: JiraTuiGo/go.mod
          cache-dependency-path: JiraTuiGo/go.sum

      - name: Build all targets
        working-directory: JiraTuiGo
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_COMMIT=${COMMIT:0:7}
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${SHORT_COMMIT} -X main.date=${DATE}"

          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o jiratui-linux-amd64   .
          GOOS=linux   GOARCH=386   go build -ldflags "${LDFLAGS}" -o jiratui-linux-386     .
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o jiratui-windows-amd64.exe .

          sha256sum jiratui-linux-amd64 jiratui-linux-386 jiratui-windows-amd64.exe > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            JiraTuiGo/jiratui-linux-amd64
            JiraTuiGo/jiratui-linux-386
            JiraTuiGo/jiratui-windows-amd64.exe
            JiraTuiGo/checksums.txt
